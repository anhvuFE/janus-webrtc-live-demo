# coturn STUN/TURN server (demo)
# Docs: https://github.com/coturn/coturn/wiki/turnserver
#
# Optional for local single-machine testing (Janus advertises 127.0.0.1 there),
# but required once presenter/viewer are on different networks behind NAT.

listening-port=3478
fingerprint

# Long-term credentials used by the browser ICE config and (optionally) Janus.
lt-cred-mech
user=januswebrtc:demo-turn-secret
realm=janus.demo

# Relay range — keep small and expose it in docker-compose.yml.
min-port=49160
max-port=49200

# Demo hardening: don't relay to private/loopback ranges from the open internet.
no-multicast-peers
no-cli
no-tls
no-dtls

# For a real deployment set these to the server's public IP:
# external-ip=YOUR_PUBLIC_IP
# relay-ip=0.0.0.0

verbose
